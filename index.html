<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cambridge Luxury Travel OS</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --app-bg: #F4F5F7;
            --card-bg: #FFFFFF;
            --primary-text: #2C2C2E;
            --sub-text: #8E8E93;
            --accent-gold: #A67C52;
            --food-red: #D57E7E;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            background-color: var(--app-bg); color: var(--primary-text);
            margin: 0; padding-bottom: 50px; -webkit-font-smoothing: antialiased;
        }

        /* 頂部導航 - 複刻原生 App 感 */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-info { line-height: 1.2; }
        .header-title { font-size: 1.1rem; font-weight: 700; color: #000; letter-spacing: 1px; }
        .header-sub { font-size: 0.65rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; }

        .lock-btn {
            background: #000; color: #FFF; border: none; padding: 8px 20px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .lock-btn.unlocked { background: #FF3B30; }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; }

        /* 行程卡片基礎 */
        .card-wrapper { position: relative; margin-bottom: 20px; }
        
        .time-badge {
            font-size: 0.85rem; font-weight: 700; color: var(--primary-text);
            margin-bottom: 10px; display: flex; align-items: center;
        }
        .time-badge::after { content: ''; flex: 1; height: 1px; background: #E5E5E5; margin-left: 15px; }

        .card {
            background: var(--card-bg); border-radius: var(--border-radius);
            padding: 20px; box-shadow: var(--shadow); position: relative;
            transition: transform 0.2s ease;
        }
        
        /* 🔒 絕對死鎖機制 */
        body.read-mode .editable-content {
            pointer-events: none !important; user-select: none !important;
            border: none !important; background: transparent !important;
        }

        .category-tag {
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
            color: var(--accent-gold); text-transform: uppercase; margin-bottom: 12px; display: block;
        }
        .category-tag.food { color: var(--food-red); }

        .title { font-size: 1.25rem; font-weight: 700; margin: 0 0 15px 0; color: #000; }

        .info-grid { font-size: 0.8rem; color: var(--sub-text); display: grid; gap: 8px; }
        .info-item { display: flex; align-items: center; }
        .info-item b { color: var(--primary-text); width: 85px; font-weight: 600; }

        /* 複刻 Point & Speak */
        .point-speak {
            margin: 20px 0; background: #F9F9FB; border-radius: 12px; padding: 15px;
        }
        .speak-header { font-size: 0.65rem; color: var(--sub-text); letter-spacing: 1px; margin-bottom: 10px; }
        .speak-row {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #EDEDF0; font-size: 0.85rem;
        }
        .speak-row:last-child { border: none; }
        .speak-cn { font-weight: 500; }
        .speak-en { color: var(--sub-text); font-style: italic; }

        /* 詳細內容展開 */
        .details { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #F2F2F7; }
        .card-wrapper.open .details { display: block; }

        .about-section { font-size: 0.9rem; line-height: 1.8; color: #48484A; }
        .about-section p { margin-bottom: 15px; }
        .about-section .label { font-weight: 700; color: var(--primary-text); display: block; margin-bottom: 5px; }

        /* 導航按鈕複刻 */
        .nav-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn-nav {
            background: #F2F2F7; color: #007AFF; text-decoration: none;
            padding: 12px; border-radius: 12px; font-size: 0.75rem;
            font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center;
        }

        /* 編輯介面 */
        .edit-ui { display: none; margin-top: 20px; padding: 15px; background: #FFF9F9; border-radius: 12px; }
        body.edit-mode .edit-ui { display: block; }
        .input-url { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 8px; font-size: 0.7rem; }
        
        .drag-handle { position: absolute; left: -30px; top: 50%; display: none; cursor: grab; color: #CCC; }
        body.edit-mode .drag-handle { display: block; }

        .add-actions { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 30px; }
        body.edit-mode .add-actions { display: grid; }
        .btn-add { background: #FFF; border: 1px solid #E5E5EA; padding: 15px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: var(--sub-text); }
    </style>
</head>
<body class="read-mode">

<header>
    <div class="header-info">
        <div class="header-sub">United Kingdom • 2026</div>
        <div class="header-title" contenteditable="true">Cambridge One Day</div>
    </div>
    <button class="lock-btn" id="lockBtn" onclick="toggleMode()">🔒 LOCK</button>
</header>

<div class="container">
    <div id="itinerary-list">
        </div>

    <div class="add-actions">
        <button class="btn-add" onclick="addItem('Attraction')">＋ ATTRACTION</button>
        <button class="btn-add" onclick="addItem('Food')">＋ FOOD</button>
        <button class="btn-add" onclick="addItem('Transport')">＋ TRANSPORT</button>
        <button class="btn-add" onclick="addItem('Experience')">＋ EXPERIENCE</button>
    </div>
</div>

<script>
let isEditing = false;
const initialData = [
    {
        time: "11:30", type: "Transport", title: "London King's Cross ➜ Cambridge",
        open: "Fast Train (48 mins)", price: "£20 - £45 (Return)",
        story: `<div class="about-section">
            <p><span class="label">【交通攻略】</span>請於 <b>London King's Cross</b> 搭乘直達快車。抵達劍橋站後，前往出口左側 <b>Stop 8 (Cambridge Station)</b>，搭乘 Universal Bus (U Line) 直達市中心。</p>
        </div>`,
        map: "https://maps.app.goo.gl/xxx",
        isFood: false
    },
    {
        time: "13:00", type: "Food", title: "午餐：Fitzbillies (Century-old)",
        open: "08:00 - 18:00", price: "Chelsea Bun £4.5",
        story: `<div class="about-section">
            <p><span class="label">【店名由來】</span>自 1920 年開業以來，這家店已成為劍橋的代名詞。這裡的 Chelsea Bun 餵飽了無數代的劍橋學生。</p>
            <p><span class="label">【必點建議】</span>糖漿濃郁的肉桂捲是招牌。若想體驗完整英式感，推薦在此享用 Cream Tea。</p>
        </div>
        <div class="point-speak">
            <div class="speak-header">指差し会話 (POINT & SPEAK)</div>
            <div class="speak-row"><span class="speak-cn">招牌肉桂捲</span><span class="speak-en">Chelsea Bun</span></div>
            <div class="speak-row"><span class="speak-cn">英式司康套餐</span><span class="speak-en">Cream Tea Set</span></div>
        </div>`,
        map: "https://maps.app.goo.gl/yyy",
        isFood: true
    },
    {
        time: "14:30", type: "Attraction", title: "國王學院 King's College",
        open: "10:30 - 15:30", price: "£15 (Advance Booking Req.)",
        story: `<div class="about-section">
            <p><span class="label">【必看亮點】</span><b>扇形拱頂 (Fan Vault)</b>。這是世界上最大的扇形拱頂，其複雜的石雕結構精緻得如同蕾絲。</p>
            <p><span class="label">【趣聞軼事】</span>在學院後花園康河畔，可以找到<b>徐志摩紀念石</b>，上面刻著《再別康橋》的經典詩句。</p>
        </div>`,
        map: "https://maps.app.goo.gl/zzz",
        isFood: false
    }
];

function init() {
    const saved = localStorage.getItem('cam_pro_v15');
    const data = saved ? JSON.parse(saved) : initialData;
    render(data);
}

function render(data) {
    const list = document.getElementById('itinerary-list');
    list.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card-wrapper';
        const foodClass = item.isFood ? 'food' : '';
        div.innerHTML = `
            <div class="drag-handle">⠿</div>
            <div class="time-badge editable-content" contenteditable="true">${item.time}</div>
            <div class="card" onclick="expand(this, event)">
                <span class="category-tag ${foodClass} editable-content" contenteditable="true">${item.type}</span>
                <div class="title editable-content" contenteditable="true">${item.title}</div>
                <div class="info-grid">
                    <div class="info-item"><b>OPENING</b> <span class="editable-content" contenteditable="true">${item.open}</span></div>
                    <div class="info-item"><b>TICKET</b> <span class="editable-content" contenteditable="true">${item.price}</span></div>
                </div>
                <div class="details">
                    <div class="editable-content" contenteditable="true">${item.story}</div>
                    <div class="edit-ui">
                        <input type="text" class="input-url" value="${item.map}">
                        <button onclick="delItem(this)" style="color:red; background:none; border:none; margin-top:10px;">移除此項</button>
                    </div>
                    <div class="nav-actions">
                        <a href="${item.map}" class="btn-nav" target="_blank">🗺️ Google Maps</a>
                        <a href="#" class="btn-nav">🌐 官方網站</a>
                    </div>
                </div>
            </div>`;
        list.appendChild(div);
    });
}

function expand(card, event) {
    if(!isEditing) {
        card.closest('.card-wrapper').classList.toggle('open');
    }
}

function toggleMode() {
    isEditing = !isEditing;
    const btn = document.getElementById('lockBtn');
    document.body.className = isEditing ? 'edit-mode' : 'read-mode';
    if(isEditing) {
        btn.innerText = "🔓 UNLOCK"; btn.classList.add('unlocked');
        sortable.option("disabled", false);
    } else {
        btn.innerText = "🔒 LOCK"; btn.classList.remove('unlocked');
        sortable.option("disabled", true);
        save();
    }
}

function save() {
    const cards = document.querySelectorAll('.card-wrapper');
    const data = Array.from(cards).map(c => ({
        time: c.querySelector('.time-badge').innerText,
        type: c.querySelector('.category-tag').innerText,
        title: c.querySelector('.title').innerText,
        open: c.querySelectorAll('.info-item span')[0].innerText,
        price: c.querySelectorAll('.info-item span')[1].innerText,
        story: c.querySelector('.editable-content:last-of-type').innerHTML,
        map: c.querySelector('.input-url').value,
        isFood: c.querySelector('.category-tag').classList.contains('food')
    }));
    localStorage.setItem('cam_pro_v15', JSON.stringify(data));
    render(data);
}

function delItem(btn) { if(confirm('確定移除？')) { btn.closest('.card-wrapper').remove(); save(); } }

function addItem(type) {
    const newItem = { time: "12:00", type: type, title: "新景點名稱", open: "09:00-18:00", price: "£0", story: "<p>介紹內容...</p>", map: "#", isFood: type === 'Food' };
    const curr = JSON.parse(localStorage.getItem('cam_pro_v15')) || initialData;
    curr.push(newItem);
    localStorage.setItem('cam_pro_v15', JSON.stringify(curr));
    render(curr);
}

const sortable = new Sortable(document.getElementById('itinerary-list'), { handle: '.drag-handle', animation: 200, disabled: true });
window.onload = init;
</script>
</body>
</html>
