<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cambridge Pro Travel v20</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --app-bg: #F4F5F7;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2E;
            --text-sub: #8E8E93;
            --zen-gold: #A67C52;
            --zen-rose: #D57E7E;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            background-color: var(--app-bg); color: var(--text-main);
            margin: 0; padding-bottom: 80px; -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            padding: 20px; border-bottom: 0.5px solid rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-size: 1rem; font-weight: 700; letter-spacing: 2px; }
        .lock-btn {
            background: #000; color: #FFF; border: none; padding: 8px 18px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .lock-btn.unlocked { background: var(--zen-rose); }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; }

        /* 卡片包裝盒與永久時間軸 */
        .card-wrapper { position: relative; margin-bottom: 30px; padding-left: 20px; border-left: 2px solid #E5E5E5; }
        .time-label {
            font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);
            position: relative; left: -28px; background: var(--app-bg); padding-right: 10px; width: fit-content;
        }

        .card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); position: relative;
        }

        /* 標籤樣式 */
        .category {
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
            color: var(--zen-gold); text-transform: uppercase; margin-bottom: 10px; display: block;
        }
        .category.food { color: var(--zen-rose); }

        .title { font-size: 1.25rem; font-weight: 700; margin: 0 0 15px 0; line-height: 1.3; }

        .info-grid { font-size: 0.8rem; color: var(--text-sub); display: grid; gap: 6px; }
        .info-row { display: flex; }
        .info-row b { color: var(--text-main); width: 85px; font-weight: 600; }

        .details { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #F2F2F7; }
        .card-wrapper.open .details { display: block; }

        /* 深度導讀本文 */
        .guide-body { font-size: 0.92rem; line-height: 1.85; color: #3A3A3C; }
        .guide-body section { margin-bottom: 20px; }
        .guide-body h4 { font-size: 0.95rem; font-weight: 700; color: #000; margin: 0 0 8px 0; display: flex; align-items: center; }
        .guide-body h4::before { content: '◈'; color: var(--zen-gold); margin-right: 8px; font-size: 0.8rem; }
        .guide-body p { margin: 0 0 12px 0; }
        .guide-body strong { color: #000; font-weight: 700; }

        /* Point & Speak */
        .point-speak {
            margin: 20px 0; background: #F9F9FB; border-radius: 12px; padding: 15px; border: 0.5px solid #EDEDF0;
        }
        .speak-row {
            display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid #E5E5E5; font-size: 0.85rem;
        }
        .speak-row:last-child { border: none; }
        .cn { font-weight: 600; }
        .en { color: var(--text-sub); font-style: italic; }

        /* 導航按鈕 */
        .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn-link {
            background: #F2F2F7; color: #007AFF; text-decoration: none;
            padding: 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-align: center;
        }

        /* 編輯介面與排序手把 */
        .edit-ui { display: none; margin-top: 20px; background: #FFF9F9; padding: 15px; border-radius: 12px; }
        body.edit-mode .edit-ui { display: block; }
        .input-box { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }

        .drag-handle { 
            position: absolute; left: -45px; top: 40px; display: none; 
            cursor: grab; color: var(--zen-gold); font-size: 1.2rem; padding: 10px;
        }
        body.edit-mode .drag-handle { display: block; }

        .add-actions { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 30px; }
        body.edit-mode .add-actions { display: grid; }
        .btn-add { background: #FFF; border: 1px solid #E5E5EA; padding: 15px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: var(--text-sub); cursor: pointer; }

        .rainy-footer { margin-top: 40px; padding: 25px; border-radius: var(--radius); background: #FFF; border: 1px solid #E5E5EA; }
    </style>
</head>
<body class="read-mode">

<header>
    <div>
        <div style="font-size:0.55rem; color:var(--text-sub); letter-spacing:3px;">CAMBRIDGE v20.ULTIMATE</div>
        <div class="header-title" id="trip-name">一日劍橋深度行程</div>
    </div>
    <button class="lock-btn" id="lockBtn" onclick="toggleMode()">🔒 LOCK</button>
</header>

<div class="container">
    <div id="itinerary-list">
        </div>

    <div class="add-actions">
        <button class="btn-add" onclick="addItem('Attraction')">＋ 景點 ATTRACTION</button>
        <button class="btn-add" onclick="addItem('Food')">＋ 美食 FOOD</button>
        <button class="btn-add" onclick="addItem('Transport')">＋ 交通 TRANSPORT</button>
        <button class="btn-add" onclick="addItem('Experience')">＋ 體驗 EXPERIENCE</button>
    </div>

    <div class="rainy-footer">
        <div style="font-size:0.75rem; font-weight:800; color:var(--zen-gold); margin-bottom:12px;">☔ 雨天備案景點</div>
        <div class="guide-body" style="font-size:0.85rem;">
            若遭遇強降雨，建議改往 <strong>Sedgwick Museum</strong>（地質博物館），室內空間極大且免費。或者前往 <strong>The Grafton Center</strong> 室內商場避雨。
        </div>
    </div>
</div>

<script>
let isEditing = false;
const cambridgeData = [
    {
        time: "09:00", type: "Transport", title: "London King's Cross ➜ Cambridge",
        open: "首班 05:00 | 15分/班", price: "約 £20-45", 
        story: `<div class="guide-body">
            <section><h4>交通攻略</h4><p>請在 <strong>London King's Cross</strong> 車站搭乘 Great Northern 或 LNER 直達快車。抵達 <strong>Cambridge Station</strong> 後，依循標示前往出口。</p></section>
            <section><h4>公車魔鬼細節</h4><p><strong>路線：</strong>Universal Bus (U Line)<br><strong>上車站：</strong>火車站出口左側 <strong>Stop 8 (Cambridge Station)</strong><br><strong>下車站：</strong><strong>Fitzwilliam Museum</strong> 站。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/3wG7PqL2S3B4m9N7A", web: "", isFood: false
    },
    {
        time: "10:15", type: "Attraction", title: "菲茨威廉博物館 (Fitzwilliam Museum)",
        open: "10:00 - 17:00 (週一休)", price: "免費 (官網預約)",
        story: `<div class="guide-body">
            <section><h4>背景歷史</h4><p>創立於 1816 年，建築呈現宏偉的新古典主義風格，是劍橋大學最精美的藝術殿堂。</p></section>
            <section><h4>必看細節</h4><p><strong>Founder's Entrance 圓廳：</strong>進入後請抬頭觀賞壯觀的大理石穹頂與對稱的巴洛克樓梯，這是建築迷的首選位置。</p></section>
            <section><h4>冷知識</h4><p>館內藏有古埃及石棺與莫內名畫，且所有的藝術品配置都極度講究光影效果。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/uXv7j7sD8uM8z5Y86", web: "https://fitzmuseum.cam.ac.uk/", isFood: false
    },
    {
        time: "12:00", type: "Food", title: "Fitzbillies (百年肉桂捲老店)",
        open: "08:00 - 18:00", price: "Chelsea Bun £4.5",
        story: `<div class="guide-body">
            <section><h4>餐廳歷史</h4><p>開業於 1920 年。曾因租金危機面臨關店，但在全劍橋市民與學生的支持下，這份歷史悠久的味道成功傳承。</p></section>
            <section><h4>美食導覽 (必點菜名)</h4><p><strong>Chelsea Bun (切爾西肉桂捲)</strong> 是必試首選。其口感厚實，表面覆蓋一層亮晶晶的濃郁焦糖糖漿，是劍橋最有代表性的甜點。</p></section>
        </div>
        <div class="point-speak">
            <div class="speak-row"><span class="cn">切爾西肉桂捲</span><span class="en">Chelsea Bun</span></div>
        </div>`,
        map: "https://maps.app.goo.gl/C2qD7vF8tS7uW9N79", web: "https://www.fitzbillies.com/", isFood: true
    },
    {
        time: "13:00", type: "Attraction", title: "聖體鐘 (Corpus Clock)",
        open: "24小時開放", price: "免費",
        story: `<div class="guide-body">
            <section><h4>背景歷史</h4><p>由約翰·C·泰勒構思並資助，2008 年由 <strong>史蒂芬·霍金</strong> 親自揭幕。鐘面由 24K 鍍金不鏽鋼組成，採用藍色 LED 顯示時間。</p></section>
            <section><h4>視覺焦點 (時間吞吃者)</h4><p>鐘頂有一隻名為 <strong>Chronophage (時間吞吃者)</strong> 的金屬蚱蜢，每分鐘眨眼與咬合，象徵生命不斷被時間吞噬。</p></section>
            <section><h4>寓意與細節</h4><p>底座刻有拉丁文，意為「這世界和其上的情慾都要過去」。它是一件將物理精確性與死亡藝術結合的曠世鉅作。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/YfS7v8B2S4S7V9N79", web: "", isFood: false
    },
    {
        time: "14:00", type: "Attraction", title: "國王學院 (King's College)",
        open: "10:30 - 15:30", price: "£15 (需預約)",
        story: `<div class="guide-body">
            <section><h4>歷史背景</h4><p>1441年由亨利六世創辦。禮拜堂擁有世界上最大的 <strong>石造扇形拱頂 (Fan Vault)</strong>。</p></section>
            <section><h4>電影連動</h4><p><strong>《愛的萬物論》：</strong>霍金在禮拜堂前漫步與思考的畫面，完美捕捉了這裡的靜謐與神聖。</p></section>
            <section><h4>必看細節</h4><p>草地旁的 <strong>徐志摩紀念石</strong> 刻有《再別康橋》，是東方遊客必訪的地點。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/A2D8v7B2S3S7W9N79", web: "https://www.kings.cam.ac.uk/", isFood: false
    },
    {
        time: "15:30", type: "Attraction", title: "聖三一學院 (Trinity College)",
        open: "10:00 - 16:00", price: "£5",
        story: `<div class="guide-body">
            <section><h4>趣聞軼事</h4><p>正門亨利八世右手拿的是 <strong>木椅腳</strong> 而非權杖。正門右側即是傳說中的 <strong>牛頓蘋果樹</strong> 的後代。</p></section>
            <section><h4>冷知識</h4><p>1. 拜倫在此讀書時因校規不准養狗，改養了一隻熊。 2. 這裡出產了極多數的諾貝爾獎得主。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/B2D8v7B2S3S7X9N79", web: "https://www.trin.cam.ac.uk/", isFood: false
    },
    {
        time: "16:30", type: "Experience", title: "康河划船 (Punting)",
        open: "09:00 - 日落", price: "£20-35",
        story: `<div class="guide-body">
            <section><h4>必看細節</h4><p>坐在平底船上，船伕會帶你穿過 <strong>嘆息橋 (Bridge of Sighs)</strong> 與 <strong>數學橋 (Mathematical Bridge)</strong>。建議選擇有學生導覽的船隻，故事最精彩。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/D2D8v7B2S3S7Y9N79", web: "", isFood: false
    },
    {
        time: "17:45", type: "Food", title: "Jack's Gelato",
        open: "11:00 - 22:00", price: "£3.5 起",
        story: `<div class="guide-body">
            <section><h4>必點美食</h4><p>這家店被公認為劍橋最強冰淇淋。<strong>具體必點菜名：Sea Salt Caramel (海鹽焦糖)</strong>、<strong>Roasted Almond (烤杏仁)</strong>。</p></section>
        </div>`,
        map: "https://maps.app.goo.gl/E2D8v7B2S3S7Z9N79", web: "", isFood: true
    },
    {
        time: "19:00", type: "Food", title: "老鷹酒吧 (The Eagle)",
        open: "11:00 - 23:00", price: "主食 £15-22",
        story: `<div class="guide-body">
            <section><h4>背景歷史</h4><p>1953 年克里克與華生在此宣布發現 <strong>DNA 雙螺旋結構</strong>。這裡也是二戰飛行員著名的聚集地。</p></section>
            <section><h4>必看細節</h4><p><strong>RAF Bar：</strong>走進後方小房間，抬頭看天花板，留有飛行員用蠟燭燻出的番號，極具震撼力。</p></section>
            <section><h4>美食導覽 (必點菜名)</h4><p><strong>Eagle DNA Ale (特色啤酒)</strong>、<strong>Traditional Fish & Chips (炸魚薯條)</strong>。一口啤酒配上一段科學史。</p></section>
        </div>
        <div class="point-speak">
            <div class="speak-row"><span class="cn">DNA 特色啤酒</span><span class="en">Eagle DNA Ale</span></div>
        </div>`,
        map: "https://maps.app.goo.gl/F2D8v7B2S3S7A9N79", web: "https://www.greeneking.co.uk/pubs/cambridgeshire/eagle", isFood: true
    }
];

// --- 系統核心邏輯 ---

function init() {
    const saved = localStorage.getItem('cam_v20_stable');
    render(saved ? JSON.parse(saved) : cambridgeData);
}

function render(data) {
    const list = document.getElementById('itinerary-list');
    list.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card-wrapper';
        const foodClass = item.isFood ? 'food' : '';
        const webBtn = item.web ? `<a href="${item.web}" class="btn-link" target="_blank">🌐 官方網站</a>` : '';
        
        div.innerHTML = `
            <div class="drag-handle">⠿</div>
            <div class="time-label editable-node" data-field="time">${item.time}</div>
            <div class="card" onclick="handleCardClick(this)">
                <span class="category ${foodClass} editable-node" data-field="type">${item.type}</span>
                <div class="title editable-node" data-field="title">${item.title}</div>
                <div class="info-grid">
                    <div class="info-row"><b>OPENING</b> <span class="editable-node" data-field="open">${item.open}</span></div>
                    <div class="info-row"><b>TICKET</b> <span class="editable-node" data-field="price">${item.price}</span></div>
                </div>
                <div class="details">
                    <div class="guide-body editable-node" data-field="story">${item.story}</div>
                    <div class="edit-ui">
                        <label style="font-size:0.6rem; color:var(--text-sub);">GOOGLE MAPS 連結</label>
                        <input type="text" class="input-box map-val" value="${item.map}">
                        <label style="font-size:0.6rem; color:var(--text-sub);">官網連結 (留空則隱藏按鈕)</label>
                        <input type="text" class="input-box web-val" value="${item.web}">
                        <button onclick="delItem(this)" style="color:red; border:none; background:none; font-size:0.75rem; cursor:pointer;">移除此項</button>
                    </div>
                    <div class="action-group">
                        <a href="${item.map}" class="btn-link" target="_blank">🗺️ Google Maps</a>
                        ${webBtn}
                    </div>
                </div>
            </div>`;
        list.appendChild(div);
    });
    applyLockState();
}

function handleCardClick(card) {
    if(!isEditing) card.closest('.card-wrapper').classList.toggle('open');
}

function applyLockState() {
    const nodes = document.querySelectorAll('.editable-node');
    nodes.forEach(n => {
        if (isEditing) {
            n.setAttribute('contenteditable', 'true');
            n.style.pointerEvents = "auto";
            n.style.background = "rgba(0,0,0,0.03)";
        } else {
            n.removeAttribute('contenteditable');
            n.style.pointerEvents = "none";
            n.style.background = "transparent";
        }
    });
}

function toggleMode() {
    isEditing = !isEditing;
    const btn = document.getElementById('lockBtn');
    document.body.className = isEditing ? 'edit-mode' : 'read-mode';
    if(isEditing) {
        btn.innerText = "🔓 UNLOCK"; btn.classList.add('unlocked');
        sortable.option("disabled", false);
    } else {
        btn.innerText = "🔒 LOCK"; btn.classList.remove('unlocked');
        sortable.option("disabled", true);
        saveToLocal();
    }
    applyLockState();
}

function saveToLocal() {
    const cards = document.querySelectorAll('.card-wrapper');
    const data = Array.from(cards).map(c => ({
        time: c.querySelector('[data-field="time"]').innerText,
        type: c.querySelector('[data-field="type"]').innerText,
        title: c.querySelector('[data-field="title"]').innerText,
        open: c.querySelector('[data-field="open"]').innerText,
        price: c.querySelector('[data-field="price"]').innerText,
        story: c.querySelector('[data-field="story"]').innerHTML,
        map: c.querySelector('.map-val').value,
        web: c.querySelector('.web-val').value,
        isFood: c.querySelector('.category').classList.contains('food')
    }));
    localStorage.setItem('cam_v20_stable', JSON.stringify(data));
    render(data);
}

function delItem(btn) { if(confirm('確定移除此項目？')) { btn.closest('.card-wrapper').remove(); saveToLocal(); } }

function addItem(type) {
    const newItem = { time: "12:00", type: type, title: "新地點", open: "09:00-18:00", price: "£0", story: "<section><h4>背景歷史</h4><p>新介紹...</p></section>", map: "https://maps.google.com", web: "", isFood: type === 'Food' };
    const curr = JSON.parse(localStorage.getItem('cam_v20_stable')) || cambridgeData;
    curr.push(newItem);
    localStorage.setItem('cam_v20_stable', JSON.stringify(curr));
    render(curr);
}

// 拖拽排序實作
const sortable = new Sortable(document.getElementById('itinerary-list'), { 
    handle: '.drag-handle', animation: 200, disabled: true,
    onEnd: function() { if(isEditing) saveToLocal(); }
});

window.onload = init;
</script>
</body>
</html>
