<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cambridge Journey OS v21</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --app-bg: #F4F5F7;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2E;
            --text-sub: #8E8E93;
            --zen-gold: #A67C52;
            --zen-rose: #D57E7E;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            background-color: var(--app-bg); color: var(--text-main);
            margin: 0; padding-bottom: 80px; -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            padding: 20px; border-bottom: 0.5px solid rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-size: 1rem; font-weight: 700; letter-spacing: 2px; }
        .lock-btn {
            background: #000; color: #FFF; border: none; padding: 8px 18px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .lock-btn.unlocked { background: var(--zen-rose); }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; }

        .card-wrapper { position: relative; margin-bottom: 30px; padding-left: 20px; border-left: 2px solid #E5E5E5; }
        .time-label {
            font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);
            position: relative; left: -28px; background: var(--app-bg); padding-right: 10px; width: fit-content;
        }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); position: relative; }
        
        .category { font-size: 0.6rem; font-weight: 800; letter-spacing: 2px; color: var(--zen-gold); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .category.food { color: var(--zen-rose); }
        .title { font-size: 1.25rem; font-weight: 700; margin: 0 0 15px 0; line-height: 1.3; }

        .info-grid { font-size: 0.8rem; color: var(--text-sub); display: grid; gap: 6px; }
        .info-row { display: flex; }
        .info-row b { color: var(--text-main); width: 85px; font-weight: 600; }

        .details { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #F2F2F7; }
        .card-wrapper.open .details { display: block; }

        .guide-body { font-size: 0.92rem; line-height: 1.8; color: #3A3A3C; }
        .guide-body section { margin-bottom: 18px; }
        .guide-body h4 { font-size: 0.95rem; font-weight: 700; color: #000; margin: 0 0 8px 0; }
        .guide-body p { margin: 0 0 10px 0; }
        .guide-body strong { color: var(--zen-gold); font-weight: 700; }

        .point-speak { margin: 20px 0; background: #F9F9FB; border-radius: 12px; padding: 15px; border: 0.5px solid #EDEDF0; }
        .speak-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid #E5E5E5; font-size: 0.85rem; }
        .speak-row:last-child { border: none; }

        .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn-link { background: #F2F2F7; color: #007AFF; text-decoration: none; padding: 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-align: center; }

        .drag-handle { position: absolute; left: -45px; top: 40px; display: none; cursor: grab; color: var(--zen-gold); font-size: 1.2rem; padding: 10px; z-index: 10; }
        body.edit-mode .drag-handle { display: block; }
        
        .edit-ui { display: none; margin-top: 20px; background: #FFF9F9; padding: 15px; border-radius: 12px; }
        body.edit-mode .edit-ui { display: block; }
        .input-box { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }

        .add-actions { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 30px 0; }
        body.edit-mode .add-actions { display: grid; }
        .btn-add { background: #FFF; border: 1px solid #E5E5EA; padding: 15px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: var(--text-sub); cursor: pointer; }
    </style>
</head>
<body class="read-mode">

<header>
    <div>
        <div style="font-size:0.55rem; color:var(--text-sub); letter-spacing:3px;">SYSTEM v21.FINAL</div>
        <div class="header-title">CAMBRIDGE ONE DAY</div>
    </div>
    <button class="lock-btn" id="lockBtn" onclick="toggleMode()">🔒 LOCK</button>
</header>

<div class="container">
    <div id="itinerary-list">
        </div>

    <div class="add-actions">
        <button class="btn-add" onclick="addItem('Attraction')">＋ ATTRACTION</button>
        <button class="btn-add" onclick="addItem('Food')">＋ FOOD</button>
        <button class="btn-add" onclick="addItem('Transport')">＋ TRANSPORT</button>
        <button class="btn-add" onclick="addItem('Experience')">＋ EXPERIENCE</button>
    </div>

    <div class="card" style="margin-top:20px; border: 1px dashed var(--zen-gold);">
        <div class="category">Rainy Day Plan</div>
        <div class="guide-body" style="font-size:0.85rem;">
            劍橋室內首選 <strong>Sedgwick Museum</strong>，擁有壯觀的恐龍化石。若需購物與避雨，可前往 <strong>The Grafton Center</strong>。
        </div>
    </div>
</div>

<script>
let isEditing = false;
const defaultData = [
    {
        time: "09:30", type: "Transport", title: "London King's Cross ➜ Cambridge",
        open: "首班 05:00 | 15分/班", price: "£20-45", 
        story: `<section><h4>交通魔鬼細節</h4><p>搭乘 <strong>Great Northern</strong> 或 <strong>LNER</strong> 直達車。抵達車站後，出口左側 <strong>Stop 8</strong> 搭乘 <strong>Universal Bus (U Line)</strong>。</p></section>
                <section><h4>精確導航</h4><p><strong>上車站：</strong>Cambridge Station Stop 8<br><strong>下車站：</strong>Fitzwilliam Museum</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Cambridge+Station", web: "https://www.nationalrail.co.uk/", isFood: false
    },
    {
        time: "10:30", type: "Attraction", title: "菲茨威廉博物館 (Fitzwilliam Museum)",
        open: "10:00 - 17:00 (週一休)", price: "免費 (官網預約)",
        story: `<section><h4>背景歷史</h4><p>創立於 1816 年，由菲茨威廉子爵遺贈。這座<strong>新古典主義建築</strong>是劍橋大學的藝術與考古中樞。</p></section>
                <section><h4>必看細節</h4><p><strong>Founder's Entrance 圓廳：</strong>進入後抬頭看，那是極其華麗的大理石穹頂。<strong>位置：</strong>一樓大廳中央。</p></section>
                <section><h4>趣聞軼事</h4><p>館內藏有一件<strong>古埃及石棺</strong>，其精緻程度與大英博物館收藏不相上下。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Fitzwilliam+Museum", web: "https://fitzmuseum.cam.ac.uk/", isFood: false
    },
    {
        time: "12:00", type: "Food", title: "Fitzbillies (百年肉桂捲)",
        open: "08:00 - 18:00", price: "Chelsea Bun £4.5",
        story: `<section><h4>美食導覽</h4><p>自 1920 年開業。必點菜名 <strong>Chelsea Bun (切爾西肉桂捲)</strong>，其焦糖糖漿厚實且紮實，是劍橋學子的共同記憶。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Fitzbillies+Trumpington+St", web: "https://www.fitzbillies.com/", isFood: true
    },
    {
        time: "13:00", type: "Attraction", title: "聖體鐘 (Corpus Clock)",
        open: "24 小時展示", price: "免費",
        story: `<section><h4>設計背景</h4><p>由約翰·C·泰勒構思，2008年由<strong>史蒂芬·霍金</strong>揭幕。鐘面為24K鍍金不鏽鋼，無指針，由LED藍光顯示時間。</p></section>
                <section><h4>最大視覺焦點</h4><p>鐘頂的金屬蚱蜢名為<strong>「時間吞吃者」(Chronophage)</strong>，象徵時間不斷被吞噬。<strong>寓意：</strong>底座刻有「這世界和其上的情慾都要過去」。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Corpus+Clock", web: "", isFood: false
    },
    {
        time: "14:00", type: "Attraction", title: "國王學院 (King's College)",
        open: "10:30 - 15:30", price: "£15",
        story: `<section><h4>建築風格</h4><p>1441年由亨利六世創辦。禮拜堂擁有<strong>世界上最大的石造扇形拱頂</strong>。</p></section>
                <section><h4>必看細節</h4><p><strong>徐志摩紀念石：</strong>位於康河畔草地。<strong>電影連動：</strong>《愛的萬物論》重要取景地。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Kings+College+Chapel", web: "https://www.kings.cam.ac.uk/", isFood: false
    },
    {
        time: "15:30", type: "Attraction", title: "聖三一學院 (Trinity College)",
        open: "10:00 - 16:00", price: "£5",
        story: `<section><h4>趣聞軼事</h4><p><strong>牛頓蘋果樹：</strong>位於正門右側。<strong>木椅腳：</strong>正門亨利八世像右手拿的是惡作劇留下的木椅腳。</p></section>
                <section><h4>冷知識</h4><p>詩人<strong>拜倫</strong>曾在此養過一隻熊，因為校規只禁止養狗，卻沒禁止熊。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Trinity+College+Cambridge", web: "https://www.trin.cam.ac.uk/", isFood: false
    },
    {
        time: "16:30", type: "Experience", title: "康河划船 (Punting)",
        open: "至日落", price: "£20-35",
        story: `<section><h4>必看細節</h4><p>從水面穿過<strong>嘆息橋 (Bridge of Sighs)</strong>與<strong>數學橋 (Mathematical Bridge)</strong>。建議選擇有學生導覽的船隻。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Cambridge+Punting", web: "", isFood: false
    },
    {
        time: "17:45", type: "Food", title: "Jack's Gelato",
        open: "11:00 - 22:00", price: "£3.5 起",
        story: `<section><h4>必點菜名</h4><p><strong>Sea Salt Caramel (海鹽焦糖)</strong>、<strong>Roasted Almond (烤杏仁)</strong>。口感滑順，口味具層次感。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=Jacks+Gelato+Cambridge", web: "", isFood: true
    },
    {
        time: "19:00", type: "Food", title: "老鷹酒吧 (The Eagle)",
        open: "11:00 - 23:00", price: "£15-22",
        story: `<section><h4>背景歷史</h4><p>1953 年克里克在此宣佈發現 <strong>DNA 雙螺旋結構</strong>。</p></section>
                <section><h4>必看細節</h4><p><strong>RAF Bar 天花板：</strong>二戰飛行員用蠟燭燻出的番號。<strong>美食必點：Eagle DNA Ale</strong>、<strong>Fish & Chips</strong>。</p></section>`,
        map: "https://www.google.com/maps/search/?api=1&query=The+Eagle+Cambridge", web: "https://www.greeneking.co.uk/pubs/cambridgeshire/eagle", isFood: true
    }
];

function init() {
    const saved = localStorage.getItem('cam_v21_final');
    render(saved ? JSON.parse(saved) : defaultData);
}

function render(data) {
    const list = document.getElementById('itinerary-list');
    list.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card-wrapper';
        const foodClass = item.isFood ? 'food' : '';
        div.innerHTML = `
            <div class="drag-handle">⠿</div>
            <div class="time-label editable-node" data-field="time">${item.time}</div>
            <div class="card" onclick="handleCardToggle(this)">
                <span class="category ${foodClass} editable-node" data-field="type">${item.type}</span>
                <div class="title editable-node" data-field="title">${item.title}</div>
                <div class="info-grid">
                    <div class="info-row"><b>OPENING</b> <span class="editable-node" data-field="open">${item.open}</span></div>
                    <div class="info-row"><b>TICKET</b> <span class="editable-node" data-field="price">${item.price}</span></div>
                </div>
                <div class="details">
                    <div class="guide-body editable-node" data-field="story">${item.story}</div>
                    <div class="edit-ui">
                        <input type="text" class="input-box map-val" value="${item.map}" placeholder="Google Map Link">
                        <input type="text" class="input-box web-val" value="${item.web}" placeholder="Official Link">
                        <button onclick="delItem(this)" style="color:red; border:none; background:none; cursor:pointer;">REMOVE</button>
                    </div>
                    <div class="action-group">
                        <a href="${item.map}" class="btn-link" target="_blank" onclick="event.stopPropagation()">🗺️ Google Maps</a>
                        ${item.web ? `<a href="${item.web}" class="btn-link" target="_blank" onclick="event.stopPropagation()">🌐 Official</a>` : ''}
                    </div>
                </div>
            </div>`;
        list.appendChild(div);
    });
    applyLock();
}

function handleCardToggle(card) {
    if(!isEditing) card.closest('.card-wrapper').classList.toggle('open');
}

function applyLock() {
    document.querySelectorAll('.editable-node').forEach(n => {
        if (isEditing) {
            n.setAttribute('contenteditable', 'true');
            n.style.pointerEvents = "auto";
        } else {
            n.removeAttribute('contenteditable');
            n.style.pointerEvents = "none";
        }
    });
}

function toggleMode() {
    isEditing = !isEditing;
    const btn = document.getElementById('lockBtn');
    document.body.className = isEditing ? 'edit-mode' : 'read-mode';
    if(isEditing) {
        btn.innerText = "🔓 UNLOCK"; btn.classList.add('unlocked');
        sortable.option("disabled", false);
    } else {
        btn.innerText = "🔒 LOCK"; btn.classList.remove('unlocked');
        sortable.option("disabled", true);
        save();
    }
    applyLock();
}

function save() {
    const cards = document.querySelectorAll('.card-wrapper');
    const data = Array.from(cards).map(c => ({
        time: c.querySelector('[data-field="time"]').innerText,
        type: c.querySelector('[data-field="type"]').innerText,
        title: c.querySelector('[data-field="title"]').innerText,
        open: c.querySelector('[data-field="open"]').innerText,
        price: c.querySelector('[data-field="price"]').innerText,
        story: c.querySelector('[data-field="story"]').innerHTML,
        map: c.querySelector('.map-val').value,
        web: c.querySelector('.web-val').value,
        isFood: c.querySelector('.category').classList.contains('food')
    }));
    localStorage.setItem('cam_v21_final', JSON.stringify(data));
}

const sortable = new Sortable(document.getElementById('itinerary-list'), { 
    handle: '.drag-handle', animation: 200, disabled: true,
    onEnd: function() { save(); }
});

function addItem(type) {
    const newItem = { time: "12:00", type: type, title: "New Spot", open: "09:00-18:00", price: "£0", story: "<section><h4>歷史</h4><p>描述...</p></section>", map: "https://google.com", web: "", isFood: type === 'Food' };
    const curr = JSON.parse(localStorage.getItem('cam_v21_final')) || defaultData;
    curr.push(newItem);
    localStorage.setItem('cam_v21_final', JSON.stringify(curr));
    render(curr);
}

function delItem(btn) { if(confirm('Remove?')) { btn.closest('.card-wrapper').remove(); save(); } }

window.onload = init;
</script>
</body>
</html>
