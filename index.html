<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Travel Guide - Cambridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F7F7F7;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        .timeline-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #E5E7EB;
            z-index: 0;
        }

        .card-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .locked [contenteditable="true"] {
            pointer-events: none;
            user-select: none;
        }

        .edit-only { display: none; }
        .editing .edit-only { display: flex; }
        
        .type-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .tag-attraction { background: #E8F5E9; color: #2E7D32; }
        .tag-food { background: #FFF3E0; color: #EF6C00; }
        .tag-transport { background: #E3F2FD; color: #1565C0; }
        .tag-experience { background: #F3E5F5; color: #7B1FA2; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="pb-20">

    <nav class="sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100 px-4 py-3 flex justify-between items-center">
        <h1 class="font-bold text-lg tracking-tight text-gray-800">Cambridge Day Trip</h1>
        <div class="flex gap-2">
            <button id="addBtn" class="edit-only bg-gray-100 p-2 rounded-full">＋</button>
            <button id="lockToggle" class="bg-gray-800 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-all active:scale-95">
                🔒 鎖定模式
            </button>
        </div>
    </nav>

    <main class="relative px-4 mt-6">
        <div class="timeline-line"></div>

        <div id="itinerary-container" class="space-y-6 relative">
            </div>
    </main>

    <div id="addMenu" class="edit-only fixed bottom-6 left-1/2 -translate-x-1/2 bg-white card-shadow rounded-2xl p-4 border border-gray-100 flex gap-4 z-50">
        <button onclick="addCard('Attraction')" class="text-xs flex flex-col items-center gap-1"><div class="w-10 h-10 rounded-full tag-attraction flex items-center justify-center">🏛️</div>景點</button>
        <button onclick="addCard('Food')" class="text-xs flex flex-col items-center gap-1"><div class="w-10 h-10 rounded-full tag-food flex items-center justify-center">🍴</div>美食</button>
        <button onclick="addCard('Transport')" class="text-xs flex flex-col items-center gap-1"><div class="w-10 h-10 rounded-full tag-transport flex items-center justify-center">🚆</div>交通</button>
        <button onclick="addCard('Experience')" class="text-xs flex flex-col items-center gap-1"><div class="w-10 h-10 rounded-full tag-experience flex items-center justify-center">🎨</div>體驗</button>
    </div>

    <script>
        let isLocked = true;
        const container = document.getElementById('itinerary-container');
        const lockBtn = document.getElementById('lockToggle');

        // 預設行程數據
        const defaultData = [
            {
                type: 'Transport',
                title: "London King's Cross to Cambridge",
                coreInfo: "車程: 約 50m | 票價: £20~ | 需預約: 建議先買",
                history: "國王十字火車站是倫敦重要的交通樞紐，建於 1852 年。其簡潔的黃磚立面展現了典型的維多利亞時代實用主義建築風格。",
                trivia: "1. 9 3/4 月台是哈利波特影迷必訪之地。 2. 車站所在地原名為 Battle Bridge，傳說波迪卡女王埋葬於此。",
                details: "推薦搭乘 Great Northern 直達快車，比普通車節省 30 分鐘。",
                movie: "《哈利波特》系列電影。",
                navigation: "https://www.google.com/maps/dir/London+King's+Cross/Cambridge+Station",
                busInfo: { route: "N/A", start: "London King's Cross", end: "Cambridge Station" },
                rainy: "若遇大雨，可改去大英圖書館 (British Library) 避雨。"
            },
            {
                type: 'Attraction',
                title: "聖體鐘 Corpus Clock",
                coreInfo: "營業: 24h | 票價: 免費 | 需預約: 否",
                history: "2008 年由物理學家史蒂芬·霍金揭幕，造價 100 萬英鎊。這是一座不靠指針而靠LED燈顯示時間的機械鐘。",
                trivia: "1. 頂部怪獸名為 Chronophage (食時獸)。 2. 時鐘每 5 分鐘才會準確一次，象徵生命的不確定性。 3. 齒輪全鍍金且無潤滑油。",
                details: "注意看食時獸的眼睛，牠每隔一陣子會眨眼，嘴角會露出一絲詭異的微笑。",
                movie: "不常出現在電影中，但在各類劍橋科學紀錄片中是常客。",
                navigation: "https://www.google.com/maps/search/Corpus+Clock",
                busInfo: { route: "Uni4", start: "Railway Station", end: "Pembroke Street" },
                rainy: "可移步至旁邊的科珀斯克里斯蒂學院圖書館參觀。"
            },
            {
                type: 'Attraction',
                title: "聖三一學院 Trinity College",
                coreInfo: "營業: 10:00-16:00 | 票價: £5 | 需預約: 現場買",
                history: "由亨利八世於 1546 年創立，是劍橋規模最大、最富有的學院，誕生過 34 位諾貝爾獎得主。",
                trivia: "1. 正門上方的亨利八世雕像手拿的是「木椅腳」而非權杖。 2. 牛頓曾在此測量音速。 3. 它是目前英國地產持有量第二大的非營利機構。",
                details: "入口右側草坪上有一棵蘋果樹，那是當年牛頓那棵樹的後裔植株。",
                movie: "《知無涯者》(The Man Who Knew Infinity)。",
                navigation: "https://www.google.com/maps/search/Trinity+College+Cambridge",
                busInfo: { route: "N/A", start: "City Centre", end: "Trinity Street" },
                rainy: "可進入著名的雷恩圖書館 (Wren Library) 室內參觀。"
            }
        ];

        // 初始化
        function init() {
            const saved = localStorage.getItem('cambridge_trip');
            const data = saved ? JSON.parse(saved) : defaultData;
            render(data);
            toggleMode(true);
        }

        function render(data) {
            container.innerHTML = '';
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'relative pl-10 group';
                card.innerHTML = `
                    <div class="absolute left-4 top-6 w-3 h-3 rounded-full bg-gray-400 z-10 border-2 border-white"></div>
                    <div class="bg-white rounded-2xl p-4 card-shadow border border-transparent transition-all active:scale-[0.98]">
                        <div class="flex justify-between items-start mb-2">
                            <span class="type-tag tag-${item.type.toLowerCase()}">${item.type}</span>
                            <div class="edit-only gap-2">
                                <button onclick="deleteCard(${index})" class="text-red-400 text-xs">刪除</button>
                            </div>
                        </div>
                        
                        <h3 class="font-bold text-lg mb-1" contenteditable="true" onblur="updateData(${index}, 'title', this.innerText)">${item.title}</h3>
                        <p class="text-sm text-gray-500 mb-3" contenteditable="true" onblur="updateData(${index}, 'coreInfo', this.innerText)">${item.coreInfo}</p>
                        
                        <details class="text-sm border-t border-gray-50 pt-3 mt-2">
                            <summary class="text-gray-400 font-medium cursor-pointer py-1 flex justify-between">
                                <span>深度導讀與導航</span>
                                <span class="text-xs">展開 ↓</span>
                            </summary>
                            <div class="space-y-4 py-3">
                                <section>
                                    <h4 class="font-bold text-gray-800">📜 背景歷史</h4>
                                    <p class="text-gray-600 leading-relaxed" contenteditable="true" onblur="updateData(${index}, 'history', this.innerText)">${item.history}</p>
                                </section>
                                <section>
                                    <h4 class="font-bold text-gray-800">💡 趣聞軼事</h4>
                                    <p class="text-gray-600 leading-relaxed" contenteditable="true" onblur="updateData(${index}, 'trivia', this.innerText)">${item.trivia}</p>
                                </section>
                                <section>
                                    <h4 class="font-bold text-gray-800">📍 必看細節</h4>
                                    <p class="text-gray-600 leading-relaxed" contenteditable="true" onblur="updateData(${index}, 'details', this.innerText)">${item.details}</p>
                                </section>
                                <section>
                                    <h4 class="font-bold text-gray-800">🎬 電影連動</h4>
                                    <p class="text-gray-600 leading-relaxed" contenteditable="true" onblur="updateData(${index}, 'movie', this.innerText)">${item.movie}</p>
                                </section>
                                <div class="bg-blue-50 p-3 rounded-xl">
                                    <h4 class="font-bold text-blue-800 mb-2">🚌 交通資訊</h4>
                                    <div class="text-xs space-y-1">
                                        <p>路線：<span contenteditable="true" onblur="updateData(${index}, 'bus_route', this.innerText)">${item.busInfo.route}</span></p>
                                        <p>上車：<span contenteditable="true" onblur="updateData(${index}, 'bus_start', this.innerText)">${item.busInfo.start}</span></p>
                                        <p>下車：<span contenteditable="true" onblur="updateData(${index}, 'bus_end', this.innerText)">${item.busInfo.end}</span></p>
                                    </div>
                                    <a href="${item.navigation}" target="_blank" class="mt-3 block text-center bg-blue-600 text-white py-2 rounded-lg text-xs font-bold">Google Maps 導航</a>
                                </div>
                                <section class="bg-gray-100 p-3 rounded-xl">
                                    <h4 class="font-bold text-gray-700">☔ 雨天備案</h4>
                                    <p class="text-xs text-gray-600 italic" contenteditable="true" onblur="updateData(${index}, 'rainy', this.innerText)">${item.rainy}</p>
                                </section>
                            </div>
                        </details>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 鎖定切換邏輯
        lockBtn.addEventListener('click', () => {
            isLocked = !isLocked;
            toggleMode(isLocked);
        });

        function toggleMode(locked) {
            if (locked) {
                document.body.classList.remove('editing');
                document.body.classList.add('locked');
                lockBtn.innerText = '🔒 鎖定模式';
                lockBtn.classList.replace('bg-green-600', 'bg-gray-800');
            } else {
                document.body.classList.add('editing');
                document.body.classList.remove('locked');
                lockBtn.innerText = '🔓 編輯模式';
                lockBtn.classList.replace('bg-gray-800', 'bg-green-600');
            }
        }

        function updateData(index, field, value) {
            let data = JSON.parse(localStorage.getItem('cambridge_trip') || JSON.stringify(defaultData));
            // 這裡簡單化處理數據結構更新
            if(field.startsWith('bus_')) {
                data[index].busInfo[field.split('_')[1]] = value;
            } else {
                data[index][field] = value;
            }
            localStorage.setItem('cambridge_trip', JSON.stringify(data));
        }

        function addCard(type) {
            const data = JSON.parse(localStorage.getItem('cambridge_trip') || JSON.stringify(defaultData));
            data.push({
                type: type,
                title: "新地點名稱",
                coreInfo: "時間 | 票價 | 預約狀態",
                history: "請填入背景歷史...",
                trivia: "請填入 2-3 個冷知識...",
                details: "具體位置標註...",
                movie: "電影場景描述...",
                navigation: "https://www.google.com/maps",
                busInfo: { route: "號碼", start: "起點", end: "終點" },
                rainy: "替代方案..."
            });
            localStorage.setItem('cambridge_trip', JSON.stringify(data));
            render(data);
            toggleMode(false);
        }

        function deleteCard(index) {
            if(confirm('確定刪除此行程？')) {
                const data = JSON.parse(localStorage.getItem('cambridge_trip'));
                data.splice(index, 1);
                localStorage.setItem('cambridge_trip', JSON.stringify(data));
                render(data);
                toggleMode(false);
            }
        }

        init();
    </script>
</body>
</html>
